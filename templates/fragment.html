{{range .}}<tr data-row draggable="true"><td class="priority"><span class="drag-handle" title="拖动排序"><i data-lucide="grip-vertical"></i></span></td><td><input class="field-input" data-name value="{{.Name}}" placeholder="名称" aria-label="上游名称"></td><td><input class="field-input" data-url value="{{.URL}}" aria-label="上游地址"></td><td><div class="auth"><select class="auth-select" data-auth-type aria-label="认证类型"><option value="none"{{if eq .AuthType "none"}} selected{{end}}>none</option><option value="basic"{{if eq .AuthType "basic"}} selected{{end}}>basic</option><option value="bearer"{{if eq .AuthType "bearer"}} selected{{end}}>bearer</option></select>{{if .AuthIsSecret}}<span class="auth-value"><input class="field-input auth-placeholder" type="password" value="••••••" aria-label="认证值（锁定）" disabled></span><span class="auth-locked" data-secret-key="{{.AuthValue}}" title="当前浏览器未持有该密钥，已锁定"><i data-lucide="lock"></i></span><input type="hidden" data-auth-value value="{{.AuthValue}}">{{else if eq .AuthType "none"}}<input type="hidden" data-auth-value value="">{{else}}<span class="auth-value"><input class="field-input" data-auth-value type="password" value="{{.AuthValue}}" aria-label="认证值"></span><button class="icon-button" type="button" data-toggle-password title="显示认证值" aria-label="显示认证值"><i data-lucide="eye"></i></button>{{end}}</div></td><td class="app-selectors"><div class="multi-select" data-multi-select><input type="hidden" data-app-selectors value="{{.AppSelectorsText}}"><div class="ms-trigger" data-ms-trigger role="button" tabindex="0" aria-haspopup="listbox" aria-expanded="false" aria-label="兼容的 AppSelector"><span class="ms-chips" data-ms-chips></span><i data-lucide="chevron-down" class="ms-chevron"></i></div><div class="ms-menu" data-ms-menu hidden role="listbox" aria-multiselectable="true"></div></div></td><td class="row-actions"><button class="icon-button danger" type="button" data-delete-row title="删除上游" aria-label="删除上游"><i data-lucide="trash-2"></i></button></td></tr>{{else}}<tr><td colspan="6">没有配置上游</td></tr>{{end}}
